pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets Gradle download a real JDK when the machine only has a JRE
    // ("does not provide the required capabilities: [JAVA_COMPILER]").
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'maparts-link'